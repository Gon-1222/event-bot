<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>イベントBOT管理</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#20283c;font:16px system-ui}main{max-width:960px;margin:48px auto;padding:0 20px}header{margin-bottom:32px}small{color:#5865f2;font-weight:700;letter-spacing:2px}h1{margin:10px 0}p{color:#647087;line-height:1.7}.panel{background:white;padding:28px;border:1px solid #e2e6ef;border-radius:18px;margin-bottom:24px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{padding:12px 18px;border:0;border-radius:9px;background:#5865f2;color:white;font:inherit;cursor:pointer}button.secondary{background:#edf0f7;color:#34405a}button.danger{background:#fff0f0;color:#b52b40}button:disabled{opacity:.45;cursor:wait}input{display:block;width:100%;border:1px solid #cdd5e5;border-radius:10px;padding:14px;font:inherit;margin:12px 0}textarea{width:100%;min-height:100px;resize:vertical;border:1px solid #cdd5e5;border-radius:10px;padding:14px;font:inherit;margin:12px 0}#status{padding:7px 14px;border-radius:100px;background:#edf0f7;font-weight:bold}.entry{padding:20px 0;border-top:1px solid #e2e6ef}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 14px}#message{position:sticky;top:0;background:#e8edff;color:#273975;padding:14px;border-radius:10px;white-space:pre-wrap}#message:empty{display:none}.entry button{margin-right:8px}h2{font-size:20px;margin:0 0 12px}</style><main><header><small>EVENT BOT / ADMIN</small><h1>イベントBOT管理</h1><p>投稿の運用と、次回のイベント候補を管理します。</p></header><div id="message" role="status" aria-live="polite"></div><section class="panel"><h2>BOTの動作</h2><div class="controls"><span id="status">読み込み中</span><button id="on">ONにする</button><button id="off" class="secondary">OFFにする</button><button id="run" class="secondary">今すぐ手動実行</button></div><p>OFF中は外部からの自動実行を停止します。手動実行はOFF中も可能です。送信に成功したイベントは候補から削除されます。</p><p id="webhook"></p></section><section class="panel"><h2>イベントを追加</h2><p>ご自身が実施できる内容のイベントだけを提案してください。</p><form id="add"><label for="name">名前（必須）</label><input id="name" required maxlength="100" placeholder="名前"><label for="content">イベント内容</label><textarea id="content" required maxlength="1000" placeholder="例：金曜日のボードゲーム交流会"></textarea><button>イベントを追加</button></form></section><section class="panel"><div class="controls"><h2 id="count">イベント一覧</h2><button id="reload" class="secondary">再読み込み</button></div><div id="events"></div></section></main><script>
const base={{ admin_base|tojson }},$=s=>document.querySelector(s);let busy=false;
async function api(path,method='GET',data){const r=await fetch(base+'/api/'+path,{method,headers:{'Content-Type':'application/json','X-Admin-Request':'1'},...(data===undefined?{}:{body:JSON.stringify(data)})});let j;try{j=await r.json()}catch{throw Error('応答を取得できませんでした。再読み込みしてください。')}if(!r.ok)throw Error(j.error||'操作に失敗しました');return j}
async function load(){const s=await api('state');$('#status').textContent=s.enabled?'● ON / 稼働中':'● OFF / 停止中';$('#status').style.color=s.enabled?'#13754b':'#687184';$('#webhook').textContent=s.webhook_configured?'Discord接続先：設定済み':'Discord接続先：未設定（環境変数 DISCORD_WEBHOOK_URL を設定してください）';$('#count').textContent='イベント一覧（'+s.events.length+'件）';const list=$('#events');list.replaceChildren();if(!s.events.length){list.textContent='イベントはまだありません。上のフォームから追加してください。'}for(const e of s.events){const row=document.createElement('article');row.className='entry';const text=document.createElement('p');text.className='body';text.textContent=e.event+'\n提案者：'+(e.name||'未登録');const edit=document.createElement('button');edit.textContent='修正';edit.className='secondary';edit.onclick=()=>{row.replaceChildren();const name=document.createElement('input');name.value=e.name||'';name.maxLength=100;name.setAttribute('aria-label','提案者の名前');name.placeholder='提案者の名前';const area=document.createElement('textarea');area.value=e.event;area.maxLength=1000;area.setAttribute('aria-label','イベント内容を修正');const save=document.createElement('button');save.textContent='保存';save.onclick=()=>act(async()=>{await api('events/'+encodeURIComponent(e.id),'PUT',{event:area.value,name:name.value});return '修正しました'});const cancel=document.createElement('button');cancel.textContent='キャンセル';cancel.className='secondary';cancel.onclick=()=>act(load);row.append(name,area,save,cancel)};const del=document.createElement('button');del.className='danger';del.textContent='削除';del.onclick=()=>{if(confirm('このイベントを削除しますか？\n'+e.event))act(async()=>{await api('events/'+encodeURIComponent(e.id),'DELETE');return '削除しました'})};row.append(text,edit,del);list.append(row)}}
async function act(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('#message').textContent='処理中…';try{const message=await fn();await load();$('#message').textContent=typeof message==='string'?message:''}catch(e){$('#message').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('#on').onclick=()=>act(async()=>{await api('toggle','POST',{enabled:true});return 'BOTをONにしました'});$('#off').onclick=()=>act(async()=>{await api('toggle','POST',{enabled:false});return 'BOTをOFFにしました'});$('#run').onclick=()=>{if(confirm('イベントと担当者をランダムに選び、今すぐDiscordへ投稿しますか？'))act(async()=>{const e=await api('run','POST');return 'Discordに投稿しました：'+e.event})};$('#add').onsubmit=e=>{e.preventDefault();act(async()=>{await api('events','POST',{event:$('#content').value,name:$('#name').value});$('#content').value='';$('#name').value='';return '追加しました'})};$('#reload').onclick=()=>act(load);act(load);
</script></html>
