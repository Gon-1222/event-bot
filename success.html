<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>送信完了 | 抽選フォーム</title>
	<style>
		:root {
			color-scheme: light;
			--navy: #17233c;
			--blue: #315fce;
			--muted: #667085;
			--line: #e6e9f0;
			--background: #f5f7fb;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-width: 320px;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			color: var(--navy);
			background: var(--background);
			font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
		}

		.card {
			width: min(100%, 560px);
			padding: clamp(32px, 7vw, 64px) clamp(22px, 7vw, 68px);
			text-align: center;
			background: #fff;
			border: 1px solid var(--line);
			border-radius: 20px;
			box-shadow: 0 14px 40px rgba(23, 35, 60, .08);
		}

		.check {
			width: 76px;
			height: 76px;
			display: grid;
			place-items: center;
			margin: 0 auto 26px;
			color: #fff;
			background: var(--blue);
			border-radius: 50%;
			font-size: 42px;
			font-weight: 700;
			line-height: 1;
		}

		h1 { margin: 0; font-size: clamp(24px, 5vw, 32px); letter-spacing: .04em; }

		.message {
			margin: 20px 0 0;
			color: var(--muted);
			font-size: 15px;
			line-height: 2;
		}

		.notice {
			margin: 28px 0 0;
			padding: 16px;
			color: #4b5565;
			background: #f7f9fc;
			border-radius: 10px;
			font-size: 13px;
			line-height: 1.8;
		}

		.button {
			display: inline-block;
			min-width: 220px;
			margin-top: 30px;
			padding: 14px 24px;
			color: #fff;
			background: var(--blue);
			border-radius: 8px;
			font-size: 15px;
			font-weight: 700;
			text-decoration: none;
			transition: background .2s, transform .2s;
		}

		.button:hover { background: #254ba8; transform: translateY(-1px); }
		.button:focus-visible { outline: 3px solid #9db4f4; outline-offset: 3px; }

		@media (max-width: 480px) {
			body { padding: 16px; }
			.card { border-radius: 16px; }
			.check { width: 64px; height: 64px; margin-bottom: 22px; font-size: 36px; }
			.message { font-size: 14px; }
			.button { width: 100%; }
		}
	</style>
</head>
<body>
	<main class="card" aria-labelledby="page-title">
		<div class="check" aria-hidden="true">✓</div>
		<h1 id="page-title">送信が完了しました</h1>
	</main>
</body>
</html>
